<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Game 3D giáo dục cho bé 5 tuổi: trả lời câu hỏi để giúp đoàn tàu thoát khỏi Tàu Nhện.">
<meta name="theme-color" content="#9fd7ff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚂</text></svg>">
<title>Đoàn Tàu Nhỏ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}

/* Layout: full-screen 3D track; chunky toy-like cards float over it (HUD top, quiz card bottom) */
:root{
  --ink:#2b2340; --card:#ffffff; --soft:#f1f3ff; --sun:#ffc531; --tomato:#ff5a4e;
  --leaf:#1fae6a; --sky:#3d9bff; --grape:#7a5cff; --muted:#6c6584;
  --font:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:#9fd7ff;color:var(--ink);font-family:var(--font)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:var(--ink);cursor:pointer}
button:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
.chunk{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink)}
.btn{border:3px solid var(--ink);border-radius:16px;background:var(--sun);font-weight:800;font-size:1.25rem;padding:.45rem 1.2rem;box-shadow:0 5px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--card)}
.layer{position:fixed;inset:0;pointer-events:none}
.layer > *{pointer-events:auto}

/* HUD */
#hud{display:flex;flex-direction:column;align-items:stretch;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;gap:8px}
#hudTop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}
#hudTop > *{pointer-events:auto}
.pill{padding:.15rem .8rem;font-weight:800;font-size:1rem;white-space:nowrap}
#stageLbl small{font-weight:600;color:var(--muted);margin-right:.35rem}
#boss{flex:1;max-width:360px;padding:.3rem .7rem .5rem;text-align:center}
#bossName{font-weight:800;font-size:.95rem;line-height:1.2}
#bossBar{display:flex;gap:4px;margin-top:4px}
#bossBar i{flex:1;height:14px;border-radius:6px;background:var(--tomato);border:2px solid var(--ink);transition:background .3s,transform .3s}
#bossBar i.off{background:var(--soft);transform:scaleY(.6)}
#rightTools{display:flex;gap:6px}
.iconBtn{width:46px;height:46px;border-radius:14px;font-size:1.3rem;padding:0;display:grid;place-items:center;background:var(--card);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
#subHud{display:flex;gap:8px;align-items:center;justify-content:center;pointer-events:none}
#energy{display:flex;gap:4px;padding:.2rem .6rem;align-items:center;font-weight:800}
#energy span{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);background:var(--soft);display:grid;place-items:center;font-size:.8rem}
#energy span.on{background:var(--sun)}
#starsLbl{font-variant-numeric:tabular-nums}
#combo{padding:.15rem .7rem;font-weight:800;background:var(--tomato);color:#fff;border-color:var(--ink)}


#flash{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:clamp(2.2rem,8vw,4.5rem);font-weight:800;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);white-space:nowrap;pointer-events:none;text-align:center}
#flash.show{animation:pop 1.4s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}

/* Quiz card */
#quiz{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:translate(-50%,120%);width:min(720px,calc(100% - 24px));padding:14px 16px 18px;transition:transform .35s cubic-bezier(.2,1.3,.4,1);box-sizing:border-box}
#quiz.open{transform:translate(-50%,0)}
#qHead{display:flex;align-items:center;gap:10px}
#qText{flex:1;font-size:clamp(1.25rem,4.4vw,1.75rem);font-weight:800;line-height:1.2;text-wrap:balance;min-width:0}
#qSay{flex:none}
#qVis{margin:10px 0 12px;min-height:84px;background:var(--soft);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;font-size:clamp(1.9rem,7vw,2.6rem);line-height:1}
#qHint{font-size:1rem;font-weight:700;color:var(--grape);text-align:center;min-height:1.4em;margin-top:-6px;margin-bottom:6px}
#qOpts{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
.opt{min-height:78px;font-size:2.2rem;font-weight:800;border:3px solid var(--ink);border-radius:18px;background:var(--card);box-shadow:0 5px 0 var(--ink);display:grid;place-items:center;padding:6px;transition:transform .08s,opacity .3s,background .2s}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.opt.txt{font-size:1.35rem}
.opt.good{background:#b8f2cf;animation:yay .5s}
.opt.bad{background:#ffd3cf;animation:shake .4s;opacity:.45;pointer-events:none}
.opt.dim{opacity:.25;pointer-events:none}
.opt.glow{animation:glow 1s infinite alternate}
@keyframes glow{to{background:#fff3c4}}
@keyframes yay{50%{transform:scale(1.1)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.it{position:relative;display:inline-block}
.it b.num{position:absolute;left:50%;bottom:-.55em;transform:translateX(-50%);font-size:.42em;background:var(--sun);border:2px solid var(--ink);border-radius:999px;padding:0 .4em;display:none;line-height:1.3}
.shownum .it b.num{display:block}
.it.away{animation:float 1.4s infinite alternate}
@keyframes float{to{transform:translateY(-8px) rotate(8deg)}}
.crossed .it.away{opacity:.3;animation:none}
.crossed .it.away::after{content:'';position:absolute;inset:10% -5%;background:linear-gradient(45deg,transparent 45%,var(--tomato) 45%,var(--tomato) 55%,transparent 55%)}
.crossed .it.away b.num{display:none!important}
.op{font-size:.8em;font-weight:800;color:var(--grape);padding:0 .2em}
.grp{display:inline-flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:100%}
.rows{display:flex;flex-direction:column;gap:6px;align-items:flex-start;width:100%}
.rows .row{display:flex;align-items:center;gap:8px;font-size:.85em}
.rows .row em{font-style:normal;font-size:.45em;font-weight:800;width:4.5em;color:var(--muted)}
.shape{display:inline-block;width:56px;height:56px;border:3px solid var(--ink);box-sizing:border-box}
.shape.tron{border-radius:50%}
.shape.vuong{border-radius:4px}
.shape.chunhat{width:80px;height:44px;border-radius:4px}
.shape.tamgiac{border:0;width:62px;height:56px;clip-path:polygon(50% 0,100% 100%,0 100%)}
.balloon{display:inline-block;width:46px;height:58px;border-radius:50% 50% 48% 48%;border:3px solid var(--ink);position:relative}
.balloon::after{content:'';position:absolute;left:50%;top:100%;width:2px;height:16px;background:var(--ink)}
.space{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);place-items:center;font-size:2.4rem}
.box{width:110px;height:80px;border:4px dashed var(--grape);border-radius:12px;display:grid;place-items:center;position:relative}
.sceneRow{display:flex;align-items:center;gap:22px;font-size:2.4rem}

/* Part reward toast */
#gift{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%) scale(.5);opacity:0;padding:10px 18px;display:flex;align-items:center;gap:12px;pointer-events:none;transition:all .35s cubic-bezier(.2,1.4,.4,1);background:#fff7d6}
#gift.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#gift .gi{font-size:2.6rem}
#gift .gt{font-weight:800;font-size:1.1rem;line-height:1.15}
#gift .gt small{display:block;font-weight:600;color:var(--muted);font-size:.85rem}

/* Select screen */
#select{display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 14px);pointer-events:none;box-sizing:border-box}
#select > *{pointer-events:auto}
#logo{align-self:center;text-align:center;padding:.3rem 1.2rem .5rem;max-width:calc(100% - 8px);box-sizing:border-box}
#logo h1{margin:0;font-size:clamp(1.8rem,7vw,2.8rem);line-height:1;letter-spacing:.5px}
#logo h1 span{color:var(--tomato)}
#logo p{margin:.15rem 0 0;font-weight:700;color:var(--muted)}
#panel{align-self:center;width:min(720px,100%);padding:12px 14px 16px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
#pick{display:flex;align-items:center;gap:10px}
#pickInfo{flex:1;text-align:center;min-width:0}
#pickName{font-size:1.7rem;font-weight:800;line-height:1.1}
#pickLine{font-weight:600;color:var(--muted);font-size:1rem}
.lbl{font-weight:800;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#garage{display:flex;flex-wrap:wrap;gap:4px}
#garage span{width:34px;height:34px;display:grid;place-items:center;font-size:1.2rem;border-radius:10px;background:var(--soft);border:2px solid transparent}
#garage span.own{background:#fff3c4;border-color:var(--ink)}
#garage span:not(.own){filter:grayscale(1);opacity:.35}
#stages{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.st{flex:none;padding:.3rem .7rem;border:3px solid var(--ink);border-radius:14px;background:var(--card);font-weight:800;font-size:.95rem;text-align:left;line-height:1.1}
.st small{display:block;font-weight:600;font-size:.75rem;color:var(--muted)}
.st.on{background:var(--sky);color:#fff}
.st.on small{color:#e8f2ff}
.st[disabled]{opacity:.4;cursor:not-allowed}
#go{font-size:1.6rem;padding:.4rem 1rem}
#voiceRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#voiceSel{flex:1;min-width:0;font:700 1rem var(--font);color:var(--ink);background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:.35rem .5rem}
#voiceTest{font-size:1rem;padding:.3rem .8rem}
#voiceNote{font-size:.85rem;color:var(--muted);text-align:center;font-weight:600}

/* Summary */
#sum{display:grid;place-items:center;background:rgba(43,35,64,.45);padding:16px}
#sumCard{width:min(440px,100%);padding:18px;text-align:center;box-sizing:border-box}
#sumStars{font-size:3rem;letter-spacing:.2em}
#sumCard h2{margin:.2rem 0;font-size:1.9rem;line-height:1.1}
#sumCard p{margin:.3rem 0;font-weight:700}
#sumParts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:.6rem 0}
#sumParts span{background:#fff3c4;border:2px solid var(--ink);border-radius:12px;padding:.1rem .5rem;font-weight:700}
#sumBtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.confetti{position:fixed;top:-20px;width:12px;height:16px;pointer-events:none;animation:fall linear forwards;z-index:5}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
@media (max-width:520px){
  .pill{font-size:.85rem}
  #stageLbl small{display:none}
  .opt{min-height:66px;font-size:1.9rem}
}
</style>
</head>
<body>
<canvas id="c" aria-label="Màn chơi 3D"></canvas>

<div class="layer" id="hud" hidden>
  <div id="hudTop">
    <div class="chunk pill" id="stageLbl"><small>Màn 1</small><span>Ga Bình Minh</span></div>
    <div class="chunk" id="boss"><div id="bossName">Tàu Nhện</div><div id="bossBar"></div></div>
    <div id="rightTools">
      <button class="iconBtn" id="voiceBtn2" aria-label="Bật tắt giọng nói">🔊</button>
      <button class="iconBtn" id="homeBtn" aria-label="Về chọn tàu">🏠</button>
    </div>
  </div>
  <div id="subHud">
    <div class="chunk" id="energy"><span>⚡</span><span>⚡</span><span>⚡</span><span id="starsLbl" style="width:auto;border:0;background:none;padding-left:6px">⭐ 0</span></div>
    <div class="chunk pill" id="combo" hidden>COMBO ×3</div>
  </div>
</div>
<div id="flash"></div>
<div id="gift" class="chunk"><div class="gi">💡</div><div class="gt"><small>Bé nhận được</small><span>Đèn pha</span></div></div>

<div id="quiz" class="chunk" role="dialog" aria-label="Câu hỏi">
  <div id="qHead"><div id="qText">Có mấy ngôi sao?</div><button class="iconBtn" id="qSay" aria-label="Nghe lại câu hỏi">🔊</button></div>
  <div id="qVis"></div>
  <div id="qHint"></div>
  <div id="qOpts"></div>
</div>

<div class="layer" id="select">
  <div id="logo" class="chunk"><h1>Đoàn Tàu <span>Nhỏ</span></h1><p>Cuộc chạy trốn Tàu Nhện</p></div>
  <div id="panel" class="chunk">
    <div id="pick">
      <button class="iconBtn" id="prevT" aria-label="Tàu trước">◀</button>
      <div id="pickInfo"><div id="pickName">Bí Ngô</div><div id="pickLine"></div></div>
      <button class="iconBtn" id="nextT" aria-label="Tàu sau">▶</button>
    </div>
    <div><div class="lbl" id="garageLbl">Gara bộ phận</div><div id="garage"></div></div>
    <div><div class="lbl">Chọn chặng đường</div><div id="stages"></div></div>
    <button class="btn" id="go">Xuất phát! 🚂</button>
    <div id="voiceRow"><label class="lbl" for="voiceSel">Giọng đọc</label><select id="voiceSel"></select><button class="btn ghost" id="voiceTest">🔊 Nghe thử</button></div>
    <div id="voiceNote"></div>
  </div>
</div>

<div class="layer" id="sum" hidden>
  <div class="chunk" id="sumCard">
    <div id="sumStars">⭐⭐⭐</div>
    <h2>Về đích rồi!</h2>
    <p id="sumMsg"></p>
    <p id="sumScore"></p>
    <div id="sumParts"></div>
    <div id="sumBtns">
      <button class="btn ghost" id="sumHome">🏠 Chọn tàu</button>
      <button class="btn" id="sumNext">Chặng tiếp ▶</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('dtn_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('dtn_'+k,JSON.stringify(v))}catch(e){}}};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const lerp=(a,b,t)=>a+(b-a)*t;

/* ---------------- DATA ---------------- */
const TRAINS=[
 {id:'bingo',name:'Bí Ngô',body:0xff8a2b,trim:0x7a3b12,face:'#ffe4c8',line:'Vui tính, thích hát thật to khi chạy.'},
 {id:'may',name:'Mây Hồng',body:0xff8fc0,trim:0xffffff,face:'#fff2f7',line:'Hiền lành, chạy êm như một đám mây.'},
 {id:'reu',name:'Rêu Ngọc',body:0x1fb5a3,trim:0xffd166,face:'#e9fff9',line:'Thông minh, đếm số giỏi nhất ga.'},
 {id:'ong',name:'Ong Mật',body:0xffcc1f,trim:0x2b2340,face:'#fff7dc',line:'Nhanh nhẹn, chạy vo ve khắp nơi.'},
 {id:'muc',name:'Mực Tím',body:0x7a5cff,trim:0xffc531,face:'#f0ebff',line:'Gan dạ, thích phiêu lưu trong đêm.'},
 {id:'tuyet',name:'Bông Tuyết',body:0xe6f2ff,trim:0x3d9bff,face:'#ffffff',line:'Mát lạnh, chẳng sợ núi lửa chút nào.'}
];
const PARTS=[
 {id:'lamp',name:'Đèn pha sáng',icon:'💡'},
 {id:'bell',name:'Chuông đồng',icon:'🔔'},
 {id:'w_energy',name:'Toa năng lượng',icon:'🔋'},
 {id:'chimney',name:'Ống khói vàng',icon:'♨️'},
 {id:'flag',name:'Cờ hiệu',icon:'🚩'},
 {id:'w_star',name:'Toa ngôi sao',icon:'⭐'},
 {id:'catcher',name:'Lưỡi gạt đá',icon:'🔺'},
 {id:'goldwheels',name:'Bánh xe vàng',icon:'🛞'},
 {id:'w_shield',name:'Toa giáp',icon:'🛡️'},
 {id:'whistle',name:'Còi bạc',icon:'📯'},
 {id:'w_water',name:'Toa nước',icon:'💧'},
 {id:'topstar',name:'Ngôi sao nóc tàu',icon:'🌟'},
 {id:'w_lamp',name:'Toa đèn lồng',icon:'🏮'},
 {id:'goldroof',name:'Mái lấp lánh',icon:'✨'},
 {id:'w_rainbow',name:'Toa cầu vồng',icon:'🌈'},
 {id:'crown',name:'Vương miện',icon:'👑'}
];
const WAGON_ORDER=['w_energy','w_star','w_shield','w_water','w_lamp','w_rainbow'];

/* ---------------- QUESTIONS ---------------- */
const ITEMS=[['🍎','quả táo'],['⭐','ngôi sao'],['🎈','quả bóng bay'],['🐤','chú gà con'],['🌲','cây thông'],['🐟','chú cá'],['🍓','quả dâu'],['🚃','toa tàu'],['🦋','chú bướm']];
const its=(e,n,start=0,cls=i=>'')=>Array.from({length:n},(_,i)=>`<span class="it ${cls(i)}">${e}<b class="num">${start+i+1}</b></span>`).join('');
function numOpts(ans,min=0,max=10){const s=new Set([ans]);const c=shuffle([ans-1,ans+1,ans-2,ans+2,ans+3]);for(const v of c){if(s.size>=3)break;if(v>=min&&v<=max)s.add(v)}return shuffle([...s]).map(v=>({html:String(v),ok:v===ans}))}

function qCount(max){const [e,n]=pick(ITEMS.filter(x=>x[0]!=='🚃'));const k=rnd(max>5?4:1,max);
 return {text:`Có mấy ${n}?`,say:`Con hãy đếm xem có mấy ${n} nhé!`,vis:`<div class="grp">${its(e,k)}</div>`,opts:numOpts(k,1,10),hint:v=>{v.classList.add('shownum');return 'Đếm từng cái theo số nhé!'}}}
function qAdd(){const [e,n]=pick(ITEMS);const a=rnd(1,5),b=rnd(1,Math.min(5,10-a));
 return {text:`${a} + ${b} = ?`,say:`Có ${a} ${n}, thêm ${b} ${n} nữa. Có tất cả bao nhiêu ${n}?`,vis:`<div class="grp">${its(e,a)}</div><span class="op">+</span><div class="grp">${its(e,b,a)}</div>`,opts:numOpts(a+b,1,10),hint:v=>{v.classList.add('shownum');return 'Đếm tiếp cả hai nhóm nhé!'}}}
function qSub(){const [e,n]=pick([['🎈','quả bóng bay'],['🦋','chú bướm'],['⭐','ngôi sao'],['🐤','chú gà con']]);const a=rnd(3,9),b=rnd(1,Math.min(4,a-1));
 return {text:`${a} − ${b} = ?`,say:`Có ${a} ${n}. ${b} ${n} bay đi mất. Còn lại bao nhiêu ${n}?`,vis:`<div class="grp">${its(e,a,0,i=>i>=a-b?'away':'')}</div>`,opts:numOpts(a-b,0,10),hint:v=>{v.classList.add('crossed','shownum');return `Gạch ${b} cái bay đi, đếm số còn lại nhé!`}}}
const SHAPES=[['tron','hình tròn'],['vuong','hình vuông'],['tamgiac','hình tam giác'],['chunhat','hình chữ nhật']];
const COLORS=[['đỏ','#e8473b'],['xanh dương','#3a7be0'],['xanh lá','#3fb54a'],['vàng','#f6c624'],['tím','#8e5bd6'],['cam','#f28a2e'],['hồng','#ff7fb6']];
const shapeHTML=(k,c)=>`<span class="shape ${k}" style="background:${c}"></span>`;
function qShape(){
 if(Math.random()<.3){const set=shuffle(SHAPES.filter(s=>s[0]!=='tron')).slice(0,2).concat([SHAPES[0]]);const thing=pick([['bánh xe của tàu','🛞'],['mặt trăng tròn','🌕'],['quả bóng','⚽']]);

 if(train)trainRoot.remove(...train.cars.map(c=>c.g));
 const eng=buildEngine(TRAINS[trainIdx]);const cars=[{g:eng.g,off:0,wheels:eng.wheels,spin:eng.spin}];
 let x=-3.15;for(const w of WAGON_ORDER)if(has(w)){const wg=buildWagon(w);wg.g.position.x=x;cars.push({g:wg.g,off:-x,wheels:wg.wheels,spin:wg.spin,base:x});x-=2.6}
 cars[0].base=0;cars.forEach(c=>trainRoot.add(c.g));
 train={eng,cars,tail:x+1.3};
 if(popIdx!=null)popT=1;
}

/* ---------------- GAME ---------------- */
const G={mode:'select',speed:0,dist:0,hist:[],y:0,vy:0,gap:8,boss:5,energy:0,combo:0,maxCombo:0,firstTry:0,tries:0,runT:0,rocks:[],q:null,shake:0,turbo:0,super:0,qCount:0,gained:[],monX:-20,defeat:0,jumpWarned:false};

function flash(t,col){const f=$('#flash');f.textContent=t;f.style.color=col||'#fff';f.classList.remove('show');void f.offsetWidth;f.classList.add('show')}
function updHud(){const bar=$('#bossBar');bar.innerHTML='';for(let i=0;i<5;i++){const s=document.createElement('i');if(i>=G.boss)s.className='off';bar.appendChild(s)}
 document.querySelectorAll('#energy span:not(#starsLbl)').forEach((s,i)=>s.classList.toggle('on',i<G.energy));$('#starsLbl').textContent='⭐ '+starsTotal}

function startStage(i){
 G.stage=i;const S=STAGES[i];stageIdx=i;store.set('stage',i);
 setEnv(S.env);if(monster)scene.remove(monster.g);monster=buildMonster(S.kind);monster.g.visible=true;
 Object.assign(G,{mode:'intro',speed:9,gap:16,boss:5,energy:0,combo:0,maxCombo:0,firstTry:0,qCount:0,gained:[],runT:3.2,defeat:0,turbo:0,super:0,y:0,vy:0});
 rebuildTrain();
 $('#select').hidden=true;$('#sum').hidden=true;$('#hud').hidden=false;
 $('#stageLbl').innerHTML=`<small>Chặng ${i+1}</small><span>${S.name}</span>`;$('#bossName').textContent=S.boss;$('#combo').hidden=true;updHud();
 setTimeout(()=>{if(G.mode==='intro'||G.mode==='run'){flash(S.boss+' đuổi tới!','#ffd0d0');say(`Ối! ${S.boss} đang đuổi theo! Mình cùng giúp đoàn tàu nhé!`)}},900);
 G.gapTarget=8;
}
function startRun(){G.mode='run';G.runT=2.6}
G.speedTarget=()=>G.mode==='question'?2.5:(G.turbo>0?16:10);

function askQuestion(){
 G.mode='question';const S=STAGES[G.stage];const q=pick(S.q)();G.q=q;G.tries=0;
 $('#qText').textContent=q.text;const vis=$('#qVis');vis.className='';vis.innerHTML=q.vis;$('#qHint').textContent='';
 const box=$('#qOpts');box.innerHTML='';
 q.opts.forEach(o=>{const b=document.createElement('button');b.className='opt'+(o.txt?' txt':'');b.innerHTML=o.html;b.onclick=()=>answer(o,b);box.appendChild(b)});
 $('#quiz').classList.add('open');say(q.say);
}
function answer(o,btn){
 if(G.mode!=='question'||G.locked)return;audio();
 if(o.ok){G.locked=true;btn.classList.add('good');document.querySelectorAll('.opt').forEach(b=>{if(b!==btn)b.classList.add('dim')});
  SFX.good();if(G.tries===0)G.firstTry++;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);G.energy++;G.boss--;G.qCount++;
  const thing=throwItem();
  say(pick(['Chính xác!','Giỏi quá!','Đúng rồi!','Hoan hô!'])+' Ném '+thing.n+' vào yêu quái nào!');
  setTimeout(giveGift,1300);
  if(G.combo===3)setTimeout(()=>{flash('COMBO ×3 🔥','#ffd36b');$('#combo').hidden=false;$('#combo').textContent='COMBO ×3'},900);
  if(G.combo===5){setTimeout(()=>{flash('TURBO ⚡','#9ff0ff');$('#combo').textContent='TURBO ×5'},900);G.turbo=7}
  if(G.combo===10){setTimeout(()=>{flash('SIÊU TÀU 🌟','#ffe98a');$('#combo').textContent='SIÊU TÀU'},900);G.super=8}
  updHud();
  setTimeout(()=>{
   if(G.energy>=3){G.energy=0;updHud();superWhistle()}
   $('#quiz').classList.remove('open');G.locked=false;
   if(G.boss<=0){G.mode='defeat';G.defeat=0;flash('Hạ gục rồi! 💥','#ffd36b')}
   else{startRun()}
  },2600);
 }else{
  G.tries++;btn.classList.add('bad');flash('Yêu quái tới gần! 😱','#ffd0d0');SFX.bad();G.combo=0;$('#combo').hidden=true;G.gapTarget=Math.max(G.gapTarget-2.6,1.2);G.shake=.5;if(monster)monster.lunge=.6;SFX.roar();
  if(G.tries>=2){const wrong=[...document.querySelectorAll('.opt')].filter((b,i)=>!G.q.opts[i].ok&&!b.classList.contains('bad'));if(wrong.length>1)wrong[0].classList.add('dim');
   const h=G.q.hint?G.q.hint($('#qVis')):'Nhìn kỹ lại một chút nhé!';$('#qHint').textContent='💡 '+h;say('Không sao! '+h);
   if(G.tries>=3){[...document.querySelectorAll('.opt')].forEach((b,i)=>{if(G.q.opts[i].ok)b.classList.add('glow')})}}
  else{$('#qHint').textContent='Thử lại nhé! 💛';say(pick(['Chưa đúng rồi. Mình thử lại nhé!','Không sao! Hãy thử lần nữa!']))}
 }
}
function giveGift(){
 const next=PARTS.find(p=>!owned.has(p.id));let icon,name,sub;
 if(next){owned.add(next.id);store.set('parts',[...owned]);G.gained.push(next);icon=next.icon;name=next.name;sub='Bé nhận được';rebuildTrain(true);starsTotal+=2}
 else{starsTotal+=5;icon='⭐';name='5 ngôi sao';sub='Gara đã đủ bộ! Thưởng thêm'}
 store.set('stars',starsTotal);updHud();SFX.gift();
 const g=$('#gift');g.querySelector('.gi').textContent=icon;g.querySelector('.gt').innerHTML=`<small>${sub}</small><span>${name}</span>`;g.classList.add('show');setTimeout(()=>g.classList.remove('show'),1700);
}
function superWhistle(){flash('TU TUUUUU! 📯','#fff3a0');SFX.whistle();say('Siêu còi tàu! Tu tu!');ring(train.tail);setTimeout(()=>ring(train.tail),180);G.gapTarget=Math.min(G.gapTarget+4,13);G.gap+=4}
function finishStage(){
 G.mode='summary';SFX.win();confetti();
 const stars=G.firstTry>=5?3:G.firstTry>=3?2:1;const bonus=10+stars*5;starsTotal+=bonus;store.set('stars',starsTotal);
 unlocked=Math.max(unlocked,Math.min(STAGES.length,G.stage+2));store.set('unlocked',unlocked);
 $('#sumStars').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);
 const last=G.stage===STAGES.length-1;
 $('#sumCard h2').textContent=last?'Thoát khỏi đường hầm!':'Về đích rồi!';
 $('#sumMsg').textContent=last?'Bé đã đánh bại Vua Tàu Nhện. Đoàn tàu an toàn rồi!':`Bé đã giúp đoàn tàu thoát khỏi ${STAGES[G.stage].name}!`;
 $('#sumScore').textContent=`Đúng ngay lần đầu: ${G.firstTry}/5 · +${bonus} ⭐`;
 $('#sumParts').innerHTML=G.gained.length?G.gained.map(p=>`<span>${p.icon} ${p.name}</span>`).join(''):'<span>Gara đã đủ bộ phận 🎉</span>';
 $('#sumNext').hidden=last;$('#sum').hidden=false;$('#hud').hidden=true;
 say(last?'Hoan hô! Bé đã giúp đoàn tàu thoát khỏi đường hầm cuối cùng!':'Giỏi quá! Bé đã giúp đoàn tàu về đích!');
}
function confetti(){const cols=['#ff5a4e','#ffc531','#3d9bff','#1fae6a','#7a5cff','#ff8fc0'];for(let i=0;i<60;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=pick(cols);c.style.animationDuration=(1.8+Math.random()*1.8)+'s';c.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4500)}}

/* ---------------- SELECT SCREEN ---------------- */
function renderSelect(){
 const t=TRAINS[trainIdx];$('#pickName').textContent=t.name;$('#pickLine').textContent=t.line;
 $('#garage').innerHTML=PARTS.map(p=>`<span class="${owned.has(p.id)?'own':''}" title="${p.name}">${p.icon}</span>`).join('');
 $('#garageLbl').textContent=`Gara bộ phận · ${owned.size}/${PARTS.length}`;
 $('#stages').innerHTML=STAGES.map((s,i)=>`<button class="st ${i===stageIdx?'on':''}" data-i="${i}" ${i>=unlocked?'disabled':''}>${i>=unlocked?'🔒 ':''}${s.name}<small>${s.topic}</small></button>`).join('');
 document.querySelectorAll('.st').forEach(b=>b.onclick=()=>{stageIdx=+b.dataset.i;renderSelect()});
 const on=document.querySelector('.st.on');if(on)on.scrollIntoView({block:'nearest',inline:'nearest'});
 updVoiceNote();
}
function toSelect(){G.mode='select';G.speed=0;try{speechSynthesis.cancel()}catch(e){}
 if(monster)monster.g.visible=false;
 $('#quiz').classList.remove('open');$('#hud').hidden=true;$('#sum').hidden=true;$('#select').hidden=false;
 setEnv('station');G.y=0;G.vy=0;G.hist=[];rebuildTrain();renderSelect()}
$('#prevT').onclick=()=>{trainIdx=(trainIdx+TRAINS.length-1)%TRAINS.length;store.set('train',trainIdx);rebuildTrain(true);renderSelect();audio();tone(660,.12,'triangle',.1)};
$('#nextT').onclick=()=>{trainIdx=(trainIdx+1)%TRAINS.length;store.set('train',trainIdx);rebuildTrain(true);renderSelect();audio();tone(780,.12,'triangle',.1)};
$('#go').onclick=()=>{audio();startStage(stageIdx)};
$('#homeBtn').onclick=toSelect;$('#sumHome').onclick=toSelect;
$('#sumNext').onclick=()=>startStage(Math.min(G.stage+1,STAGES.length-1));
$('#voiceBtn2').onclick=()=>{voiceOn=!voiceOn;store.set('voice',voiceOn);updVoiceNote();if(!voiceOn)try{speechSynthesis.cancel()}catch(e){}};
$('#voiceSel').onchange=e=>{viVoice=viVoices.find(v=>v.name===e.target.value)||viVoice;store.set('voiceName',viVoice&&viVoice.name);updVoiceNote();say('Xin chào! Mình là đoàn tàu nhỏ.')};
$('#voiceTest').onclick=()=>{loadVoices();const was=voiceOn;voiceOn=true;say('Xin chào! Con hãy đếm những ngôi sao nhé!');voiceOn=was};
$('#qSay').onclick=()=>{if(G.q)say(G.q.say)};
addEventListener('keydown',e=>{
 if(G.mode==='question'&&/^Digit[1-4]$/.test(e.code)){const b=document.querySelectorAll('.opt')[+e.code.slice(5)-1];if(b)b.click()}});

/* ---------------- LOOP ---------------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const camPos=new THREE.Vector3(6,4,12),camLook=new THREE.Vector3();let selAng=0;
const clock=new THREE.Clock();let T=0;
function carY(off){if(!off)return G.y;const d=G.dist-off;const h=G.hist;for(let i=h.length-1;i>=0;i--)if(h[i].d<=d)return h[i].y;return 0}
function frame(){
 const dt=Math.min(clock.getDelta(),.05);T+=dt;
 const playing=G.mode!=='select'&&G.mode!=='summary';
 // speed
 const target=G.mode==='select'?0:G.mode==='question'?2.5:G.mode==='defeat'?6:(G.turbo>0?16:10);
 G.speed=lerp(G.speed,target,1-Math.exp(-dt*2));if(G.turbo>0)G.turbo-=dt;if(G.super>0)G.super-=dt;
 const mv=G.speed*dt;G.dist+=mv;
 // jump physics
 if(G.y>0||G.vy>0){G.vy-=26*dt;G.y=Math.max(0,G.y+G.vy*dt);if(G.y===0)G.vy=0}
 G.hist.push({d:G.dist,y:G.y});while(G.hist.length&&G.hist[0].d<G.dist-60)G.hist.shift();
 // world scroll
 for(const s of sleepers){s.position.x-=mv;if(s.position.x<-42)s.position.x+=84}
 for(const s of scenery){if(!s.par)continue;s.o.position.x-=mv*s.par;if(s.o.position.x<-80)s.o.position.x+=160}
 // train
 if(train){train.cars.forEach(c=>{c.g.position.y=carY(c.off);c.wheels.forEach(w=>w.piv.rotation.z-=mv/w.r);c.spin.forEach(s=>s.rotation.y+=dt*2)});
  const e=train.eng;e.g.position.y+=Math.sin(T*18)*.015*Math.min(1,G.speed/5);
  if(e.flag){const p=e.flag.geometry.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i);p.setZ(i,Math.sin(T*10+x*8)*.06*(x+.3))}p.needsUpdate=true}
  if(popT>0){popT=Math.max(0,popT-dt*2.5);const s=1+Math.sin(popT*Math.PI)*.12;trainRoot.scale.set(s,s,s)}
  const scared=playing&&monster&&G.gap<3.2&&G.mode!=='defeat';e.faceMat.map=scared?e.scared:e.happy;
  if(G.super>0){e.body.emissive.setHSL((T*.6)%1,1,.5);e.body.emissiveIntensity=.5}else{e.body.emissiveIntensity=0}
  puffAcc+=dt*(G.speed>1?1:.35);if(puffAcc>.09){puffAcc=0;const p=e.chimney.clone();p.y+=e.g.position.y;spawnPuff(p,G.super>0?new THREE.Color().setHSL((T*.6)%1,.8,.75).getHex():G.stage===3&&playing?0xd8c8c0:0xffffff)}}
 for(const pf of puffs){if(pf.life<=0)continue;pf.life-=dt;const k=1-pf.life/pf.max;pf.m.position.x-=mv+pf.vx*dt+dt*.6;pf.m.position.y+=dt*1.4;pf.m.position.z+=pf.vz*dt;pf.m.scale.setScalar(.6+k*1.6);pf.m.material.opacity=.85*(1-k);if(pf.life<=0)pf.m.visible=false}
 // monster
 if(monster&&monster.g.visible){
  G.gapTarget=Math.max(1.4,Math.min(13,G.gapTarget));
  if(G.mode!=='defeat')G.gap=lerp(G.gap,G.gapTarget,1-Math.exp(-dt*1.6));
  const mx=train.tail-G.gap-2.2;G.monX=mx;
  const m=monster;m.g.position.x=mx;
  if(G.mode==='defeat'){G.defeat+=dt;m.g.position.x=mx-G.defeat*14;m.inner.rotation.z=G.defeat*3;m.g.position.y=Math.max(-3,4*G.defeat-6*G.defeat*G.defeat);const s=Math.max(.01,1-G.defeat*.45);m.g.scale.set(s,s,s);
   if(G.defeat>2.2){m.g.visible=false;finishStage()}}
  else{m.inner.position.y=Math.abs(Math.sin(T*9))*.15;m.inner.rotation.z=Math.sin(T*4.5)*.04;
   if(m.lunge>0){m.lunge-=dt;const k=Math.sin((1-m.lunge/.6)*Math.PI);m.inner.position.x=k*1.6;m.inner.rotation.z=-k*.25;m.inner.scale.setScalar(1+k*.15)}
   else if(m.hurt>0){m.hurt-=dt;m.inner.position.x=-Math.sin((1-m.hurt/.5)*Math.PI)*1.2;m.inner.rotation.z=Math.sin(T*40)*.12;m.inner.scale.setScalar(1)}
   else{m.inner.position.x=lerp(m.inner.position.x,0,.2);m.inner.scale.setScalar(1)}}
  m.legs.forEach(l=>l.hip.rotation.z=Math.sin(T*12+l.i*1.4+(l.s>0?Math.PI:0))*.35);
  m.flames.forEach((f,i)=>f.scale.y=1+Math.sin(T*14+i)*.3);
  m.eyeM.emissiveIntensity=1.2+Math.sin(T*6)*.5;
  if(m.flash>0){m.flash-=dt;m.bm.emissive.setHex(0xffffff);m.bm.emissiveIntensity=m.flash*3}else if(!MON[m.kind].ghost){m.bm.emissiveIntensity=0}
 }
 // shots & rings
 for(const s of shots){s.t+=dt/s.dur;const k=Math.min(1,s.t);const to=new THREE.Vector3(G.monX+2.3,1.9,0);
  s.m.position.lerpVectors(s.from,to,k);s.m.position.y+=Math.sin(k*Math.PI)*(3+Math.abs(s.from.x-to.x)*.12);s.m.rotation.x+=dt*9;s.m.rotation.z+=dt*7;
  if(s.t>=1&&!s.done){s.done=true;scene.remove(s.m);burst(to,s.col);SFX.hit();G.shake=.35;if(monster){monster.flash=.4;monster.hurt=.5}G.gapTarget=Math.min(G.gapTarget+1.8,13);flash(pick(['Trúng rồi! 💥','Bốp! 💥','Trúng phóc! 💥']),'#ffe98a')}}
 for(const b of bits){b.t+=dt;b.v.y-=18*dt;b.m.position.addScaledVector(b.v,dt);b.m.position.x-=mv;b.m.material.opacity=Math.max(0,1-b.t*1.3)}
 for(let i=bits.length-1;i>=0;i--)if(bits[i].t>.8){scene.remove(bits[i].m);bits.splice(i,1)}
 for(let i=shots.length-1;i>=0;i--)if(shots[i].done)shots.splice(i,1);
 for(const r of rings){r.t+=dt;r.m.position.x-=dt*14;r.m.scale.setScalar(1+r.t*4);r.m.material.opacity=Math.max(0,.9-r.t)}
 for(let i=rings.length-1;i>=0;i--)if(rings[i].t>1){scene.remove(rings[i].m);rings.splice(i,1)}
 // flow
 if(G.mode==='intro'){G.runT-=dt;if(G.runT<=0)askQuestion()}
 if(G.mode==='run'){G.runT-=dt;if(G.runT<=0)askQuestion()}
 // camera
 const portrait=camera.aspect<1;
 if(G.mode==='select'||!train){selAng+=dt*.35;const r=portrait?13:9.5;const cx=(train?train.tail:0)/2+.5;
  camPos.lerp(new THREE.Vector3(cx+Math.cos(selAng)*r,3.2+(portrait?1.5:0),Math.sin(selAng)*r*.6+r*.55),.05);camLook.lerp(new THREE.Vector3(cx,portrait?.2:1.0,0),.08);
  camera.fov=portrait?62:45}
 else{const front=2.5,back=monster&&monster.g.visible?G.monX-3:train.tail-1;const span=front-back;const cx=(front+back)/2;
  const f=portrait?Math.min(2.2,1/camera.aspect*.9):1;const d=(6+span*.55)*f;
  const qOpen=$('#quiz').classList.contains('open');
  camPos.lerp(new THREE.Vector3(cx+2,3.5+span*.12+(portrait?2:0),d),1-Math.exp(-dt*2));
  camLook.lerp(new THREE.Vector3(cx,qOpen?(portrait?-span*.18-2:-1.4):1.2,0),1-Math.exp(-dt*3));camera.fov=portrait?60:50}
 camera.updateProjectionMatrix();
 camera.position.copy(camPos);if(G.shake>0){G.shake-=dt;camera.position.x+=(Math.random()-.5)*G.shake;camera.position.y+=(Math.random()-.5)*G.shake}
 camera.lookAt(camLook);
 sun.position.set(camLook.x+12,22,14);sun.target.position.set(camLook.x,0,0);
 renderer.render(scene,camera);
 requestAnimationFrame(frame);
}
toSelect();
requestAnimationFrame(frame);
})();
</script>
